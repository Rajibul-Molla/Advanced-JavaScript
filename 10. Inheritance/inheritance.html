<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inheritance</title>
</head>
<body>


    <script>
         // Inheritance means suppose there are two class . class a and class b . here class a is the parent class and class b is the child class because class b can inherit class's properties and methods .
         
        class a{
            name = "Rajibul";
            age=25;

            greet(){
                console.log("Hello Rajibul this is the base class (Class A)");
            }
        }

        class b extends a{

        }

        let obj1=new a();
        obj1.greet();



        let obj2= new b();
        obj2.greet();
        console.log(obj2.name); 




        console.log("-----------------");
        class employee {
            constructor(name){

                this.empname=name
                console.log("Constructor : Employee " + name);
            }

            info(){
                console.log("Hello " + this.empname + " Welcome Back class Employee");
            }
        }

        class manager extends employee{
            /*constructor(){
                super(); // to call the parent class constructor.
                console.log("Constructor : Manager")
            }*/


            info(){
                super.info(); //this is how to call a super or parent class methods
                console.log("Hello " + this.empname + " Welcome Back class Manager");
            }




        }

        // when we have constructor of both parent and child classs . only child class constructor will be called and through a error . to call the parent class constructor also we use super() keyword.

        let obj4 = new manager("Rak");
        obj4.info()








        console.log("-----------------Real life Example-----------");
        class person{
            constructor(name,age,salary){
                this.pname=name;
                this.page=age;
                this.psalary=salary;
                console.log("COnstructor Person");
            }
            info(){
                document.write(`<h3>Class Person</h3>
                Name: ${this.pname}<br>
                Age: ${this.page}<br>
                Salary: ${this.psalary}`);
            }
        }


        class teacher extends person{
            info(){
                let ta=1000;
                let pa=3000;
                let totalsalary = this.psalary +ta+pa;
                document.write(`<h3>Class Teacher</h3>
                Name: ${this.pname}<br>
                Age: ${this.page}<br>
                Salary: ${totalsalary}`);
            }

        }

        //Multi -Level Inheritanch
        class test extends teacher{
            
        }

 



        let finalobj1 = new person("Ronith",16,5000);
        finalobj1.info();

        let finalobj2 = new teacher("Rajibul Molla",26,50000);
        finalobj2.info();










    </script>
    
</body>
</html>
