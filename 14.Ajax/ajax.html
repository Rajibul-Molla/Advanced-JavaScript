<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajax</title>
</head>
<body>

    <p id="demo">Here we load Data</p>
    <button onclick="loaddata()">Get Data</button>


    <script>
        //It is a technique in JavaScript that allows a webpage to send or receive data from a server without reloading the entire webpage.Only load a particular section of the page rathen that the hole page.

            /*    Without AJAX:

                Click Add to Cart
                    ↓
                Page reloads
                    ↓
                Server processes request
                    ↓
                Entire page loads again

                With AJAX:

                Click Add to Cart
                    ↓
                JavaScript sends request to server
                    ↓
                Server responds
                    ↓
                Only cart count changes

                
            */

            function loaddata(){
                let xhttp = new XMLHttpRequest();

                xhttp.onreadystatechange = function (){
                    if(this.readyState == 4 && this.status == 200){
                        // console.log(this.responseText);
                        document.getElementById("demo").innerHTML=this.responseText;

                    }
                    else if(this.readyState == 4 && this.status == 404){
                        document.getElementById("demo").innerHTML = "File Not Found";
                    }
                }

                


                xhttp.open('GET',"./content/readme.txt",true);
                xhttp.send();

            }


        

          



    </script>
    
</body>
</html>
