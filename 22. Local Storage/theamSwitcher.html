<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theam Switcher</title>
    <style>
        .dark{
            background: black;
            color: white;
        }
    </style>
</head>
<body>
    <button id="removebtn">Remove LocalStorage</button>

    <button id="theambtn">Switch Theam</button>


    <script>

        let currentTheam = localStorage.getItem("theme");

        if(currentTheam==="dark"){
            document.body.classList.add("dark");
        }





         
        document.querySelector("#theambtn").addEventListener("click",()=>{
            document.body.classList.toggle("dark");
        

        if(document.body.classList.contains("dark")){
            localStorage.setItem("theme","dark");
        }
        else{
            localStorage.setItem("theme","lite");
        }
    })


    //Print local storage length
    console.log(localStorage.length)
    console.log(localStorage)
    let removebtn = document.querySelector("#removebtn").addEventListener("click",()=>{
        localStorage.clear();
        console.log("Local Storage Cleared");
    })





    // Print all local storage key
    for(let i =0;i<localStorage.length;i++){
        let key = localStorage.key(i);
        console.log(`${key} : ${localStorage.getItem(key)}`);
    }

    </script>
    
</body>
</html>
