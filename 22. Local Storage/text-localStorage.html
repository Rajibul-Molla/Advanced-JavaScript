<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Local Storage</title>
        <style>
        .dark{
            background: black;
            color: white;
        }
    </style>
</head>
<body>

    <h2></h2>

    <script>
        let user = localStorage.getItem("name") || "";
        document.querySelector("h2").innerHTML = user;

        let currentTheam = localStorage.getItem("theme");

        if(currentTheam === "dark"){
            document.body.classList.add("dark");
        }

    </script>
    
</body>
</html>
