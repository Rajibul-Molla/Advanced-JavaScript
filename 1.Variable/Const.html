    <title>Const Variable</title>

<body>



    <script>

        // const Practicall

        const z="Hello";
        // const z="World"; -> can not be re-decleared 
        // z="ji";  -> can not be re-assigned

        for (const a = 1;a<5;a++){

        }
        console.log(a);



        // const variable can not be redecleared and re-assigned . and its a block scope variable 


    </script>
