<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let Variable</title>
</head>
<body>


    <script>


        // Let Practical

        let y ="Good";
        // let y="bad"; -> Cant be re-declear 
        y="Average";
        console.log(y);

        for (let a=1;a<5;a++){
            document.write(a + " ");
        }
        // console.log(a); -> can not be access outside the block


        //let variables cannot be redeclared, but they can be reassigned. They are block-scoped variables, which means they can only be accessed within the block where they are declared.




    </script>
    
</body>
</html>
