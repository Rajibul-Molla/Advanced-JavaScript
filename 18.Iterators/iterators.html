<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iterators</title>
</head>
<body>

    <script>

        /*

        An iterator is an object in JavaScript that allows you to access the elements of a collection one by one using the next() method.

        An iterator has a next() method that returns an object containing:

        value → current value
        done → true when there are no more values

        */


        let num = [100,200,300];
        let itr = num[Symbol.iterator]();
        

        itr.next(); // TO Skip one value
        console.log(itr.next());
        console.log(itr.next().value);
        console.log(itr.next().done); // false becaise this is the last value . AFTER this done status will be true because there are no value left.


        // Iterator inside a loop 

       let str = "Rajibul Molla";

       let itstr = str[Symbol.iterator]();

       let result = itstr.next();
       while(!result.done){
        console.log(result.value);
        result = itstr.next();
       }

        


    </script>
    
</body>
</html>
