<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example of Fetch api</title>
</head>
<body>

        <form id="myForm">
    Title <input type="text" id="titleText"> <br><br>
    Body <input type="text" id="bodyText"> <br><br>
    User Id <input type="text" id="userid"> <br><br>
    <input type="submit" id="saveForm">
</form>




<script>


    let btn = document.getElementById("saveForm");
    btn.addEventListener('click', (e)=>{
        e.preventDefault();

        let obj = {
        title : document.getElementById("titleText").value,
        body : document.getElementById("bodyText").value,
        userId : document.getElementById("userid").value

        }


        fetch("https://jsonplaceholder.typicode.com/posts" , {
            method : 'POST',
            body : JSON.stringify(obj), // new FormData(document.getElementById("MyForm"))
            headers : {
                'Content-type': 'application/json', //'Content-type': 'application/x-www-form-urlencoded',
            },
        }).then((response)=>{
            return response.json();
        }).then((data)=>{
            console.log(data);
        })

    } )



</script>
    
</body>
</html>
